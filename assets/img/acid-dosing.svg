<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Illustration of an automated acid dosing system: chemical drum, dosing pump and controller feeding a dairy wash line">
  <rect width="800" height="560" fill="#e4e9e6"/>
  <rect y="440" width="800" height="120" fill="#b9c2bf"/>
  <rect y="440" width="800" height="6" fill="#a3ada9"/>
  <!-- drum -->
  <rect x="80" y="220" width="150" height="222" rx="14" fill="#2d6a8f" stroke="#15232b" stroke-width="4"/>
  <rect x="80" y="262" width="150" height="10" fill="#15232b" opacity="0.35"/>
  <rect x="80" y="390" width="150" height="10" fill="#15232b" opacity="0.35"/>
  <rect x="112" y="296" width="86" height="70" rx="4" fill="#fff"/>
  <path d="M155 306 l20 34 h-40 z" fill="#f2b705" stroke="#15232b" stroke-width="3" stroke-linejoin="round"/>
  <text x="151" y="336" font-family="Archivo, sans-serif" font-weight="800" font-size="18" fill="#15232b">!</text>
  <rect x="132" y="200" width="46" height="22" fill="#15232b"/>
  <!-- suction line -->
  <path d="M156 200 V150 H300 V250" fill="none" stroke="#15232b" stroke-width="5"/>
  <!-- pump -->
  <rect x="262" y="250" width="96" height="110" rx="10" fill="#f2b705" stroke="#15232b" stroke-width="4"/>
  <circle cx="310" cy="300" r="28" fill="#fff" stroke="#15232b" stroke-width="4"/>
  <path d="M310 300 l18 -14" stroke="#15232b" stroke-width="4" stroke-linecap="round"/>
  <rect x="270" y="340" width="80" height="12" fill="#15232b" opacity="0.25"/>
  <!-- discharge to wash line -->
  <path d="M358 300 H470 V190" fill="none" stroke="#15232b" stroke-width="5"/>
  <!-- wash line / vat pipework -->
  <rect x="420" y="160" width="360" height="30" fill="#c8d0d3" stroke="#15232b" stroke-width="3"/>
  <circle cx="470" cy="175" r="10" fill="#15232b"/>
  <g fill="#1f6fb2"><circle cx="530" cy="175" r="5"/><circle cx="580" cy="175" r="5"/><circle cx="630" cy="175" r="5"/><circle cx="680" cy="175" r="5"/></g>
  <!-- controller -->
  <rect x="540" y="250" width="160" height="150" rx="8" fill="#15232b"/>
  <rect x="556" y="266" width="128" height="64" rx="3" fill="#0f1a20"/>
  <text x="566" y="294" fill="#e7edea" font-family="Archivo, sans-serif" font-weight="800" font-size="20">pH 2.4</text>
  <text x="566" y="318" fill="#b4c0c4" font-family="Archivo, sans-serif" font-weight="600" font-size="13">Dosed 180 mL</text>
  <circle cx="580" cy="362" r="11" fill="#5cbf86"/>
  <circle cx="616" cy="362" r="11" fill="#4a5a62"/>
  <path d="M540 330 C500 330, 420 330, 358 330" fill="none" stroke="#15232b" stroke-width="3" stroke-dasharray="6 5"/>
  <!-- probe -->
  <path d="M640 250 V190" stroke="#15232b" stroke-width="4"/>
</svg>

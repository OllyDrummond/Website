<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Illustration of a water tank with a level sensor on its lid sending readings to a receiver">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe0ec"/><stop offset="1" stop-color="#e8eff2"/></linearGradient>
    <pattern id="corr" width="14" height="10" patternUnits="userSpaceOnUse"><rect width="14" height="10" fill="#b9c4c8"/><rect width="14" height="3" fill="#a5b2b7"/></pattern>
  </defs>
  <rect width="800" height="560" fill="url(#sky)"/>
  <rect y="430" width="800" height="130" fill="#9bb38a"/>
  <rect y="430" width="800" height="6" fill="#86a175"/>
  <!-- tank -->
  <ellipse cx="300" cy="430" rx="190" ry="22" fill="#7f9671"/>
  <rect x="120" y="170" width="360" height="262" fill="url(#corr)"/>
  <rect x="120" y="170" width="360" height="262" fill="none" stroke="#15232b" stroke-width="4"/>
  <path d="M110 172 L300 118 L490 172 Z" fill="#c9d2d5" stroke="#15232b" stroke-width="4" stroke-linejoin="round"/>
  <!-- cutaway showing water -->
  <rect x="160" y="210" width="110" height="200" fill="#e8eff2" stroke="#15232b" stroke-width="3"/>
  <rect x="160" y="268" width="110" height="142" fill="#1f6fb2"/>
  <path d="M160 268 q14 -6 27 0 t28 0 t27 0 t28 0" fill="none" stroke="#7fb3dd" stroke-width="3"/>
  <line x1="160" y1="268" x2="270" y2="268" stroke="#f2b705" stroke-width="3" stroke-dasharray="7 5"/>
  <!-- sensor -->
  <rect x="282" y="98" width="40" height="26" rx="4" fill="#15232b"/>
  <line x1="314" y1="98" x2="314" y2="56" stroke="#15232b" stroke-width="4"/>
  <circle cx="314" cy="52" r="6" fill="#f2b705"/>
  <!-- waves -->
  <g fill="none" stroke="#f2b705" stroke-width="5" stroke-linecap="round">
    <path d="M345 60 q18 -8 36 0"/><path d="M360 40 q30 -14 60 0" opacity="0.7"/><path d="M375 20 q42 -18 84 0" opacity="0.45"/>
  </g>
  <!-- receiver -->
  <rect x="590" y="250" width="130" height="190" rx="8" fill="#15232b"/>
  <rect x="604" y="266" width="102" height="120" rx="3" fill="#0f1a20"/>
  <rect x="616" y="330" width="14" height="44" fill="#5aa6e6"/>
  <rect x="636" y="314" width="14" height="60" fill="#5aa6e6"/>
  <rect x="656" y="342" width="14" height="32" fill="#5aa6e6"/>
  <rect x="676" y="300" width="14" height="74" fill="#5aa6e6"/>
  <text x="614" y="292" fill="#e7edea" font-family="Archivo, sans-serif" font-weight="800" font-size="20">62%</text>
  <circle cx="655" cy="412" r="11" fill="#f2b705"/>
  <line x1="700" y1="250" x2="700" y2="212" stroke="#15232b" stroke-width="4"/>
  <circle cx="700" cy="208" r="6" fill="#f2b705"/>
</svg>

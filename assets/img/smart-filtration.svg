<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Illustration of a smart filtration unit with three filter housings, a pressure gauge and a controller">
  <rect width="800" height="560" fill="#dfe7e9"/>
  <rect y="450" width="800" height="110" fill="#c3cdd0"/>
  <!-- wall panel -->
  <rect x="80" y="70" width="640" height="370" rx="6" fill="#eef1ef" stroke="#15232b" stroke-width="4"/>
  <!-- main pipe -->
  <rect x="40" y="128" width="720" height="24" fill="#9aa7ac" stroke="#15232b" stroke-width="3"/>
  <!-- housings -->
  <g stroke="#15232b" stroke-width="4">
    <rect x="150" y="152" width="22" height="34" fill="#9aa7ac"/>
    <rect x="300" y="152" width="22" height="34" fill="#9aa7ac"/>
    <rect x="450" y="152" width="22" height="34" fill="#9aa7ac"/>
    <rect x="118" y="186" width="86" height="210" rx="16" fill="#cfe0ec"/>
    <rect x="268" y="186" width="86" height="210" rx="16" fill="#cfe0ec"/>
    <rect x="418" y="186" width="86" height="210" rx="16" fill="#cfe0ec"/>
  </g>
  <rect x="132" y="230" width="58" height="150" rx="6" fill="#e9e1c9"/>
  <rect x="282" y="230" width="58" height="150" rx="6" fill="#d9e8c3"/>
  <rect x="432" y="230" width="58" height="150" rx="6" fill="#1f6fb2" opacity="0.8"/>
  <g stroke="#b7a676" stroke-width="3"><line x1="140" y1="250" x2="182" y2="250"/><line x1="140" y1="270" x2="182" y2="270"/><line x1="140" y1="290" x2="182" y2="290"/><line x1="140" y1="310" x2="182" y2="310"/><line x1="140" y1="330" x2="182" y2="330"/><line x1="140" y1="350" x2="182" y2="350"/></g>
  <!-- gauge -->
  <circle cx="240" cy="110" r="0" fill="none"/>
  <line x1="236" y1="128" x2="236" y2="104" stroke="#15232b" stroke-width="4"/>
  <circle cx="236" cy="86" r="24" fill="#fff" stroke="#15232b" stroke-width="4"/>
  <line x1="236" y1="86" x2="250" y2="74" stroke="#b42318" stroke-width="3" stroke-linecap="round"/>
  <!-- controller -->
  <rect x="560" y="190" width="130" height="170" rx="8" fill="#15232b"/>
  <rect x="574" y="206" width="102" height="64" rx="3" fill="#0f1a20"/>
  <text x="584" y="236" fill="#5cbf86" font-family="Archivo, sans-serif" font-weight="800" font-size="18">FLOW OK</text>
  <text x="584" y="258" fill="#b4c0c4" font-family="Archivo, sans-serif" font-weight="600" font-size="13">ΔP 0.4 bar</text>
  <circle cx="598" cy="300" r="10" fill="#f2b705"/>
  <circle cx="628" cy="300" r="10" fill="#5cbf86"/>
  <circle cx="658" cy="300" r="10" fill="#4a5a62"/>
  <path d="M625 360 C625 410, 520 420, 470 396" fill="none" stroke="#15232b" stroke-width="4"/>
  <!-- flow arrows -->
  <g fill="#1f6fb2"><path d="M60 118 l18 -8 v16 z" transform="rotate(180 69 118)"/></g>
  <path d="M700 140 l26 0 m-10 -10 l10 10 l-10 10" stroke="#1f6fb2" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
